<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>RepoRAG Side Panel</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #090a0f;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="reporag-frame" src="http://localhost:5173"></iframe>
  <script>
    // Pass current active GitHub tab URL to iframe if detected
    chrome.tabs.query({ active: true, currentWindow: true }, (tabs) => {
      const url = tabs[0]?.url;
      if (url && url.includes("github.com")) {
        const frame = document.getElementById("reporag-frame");
        frame.src = `http://localhost:5173?repo=${encodeURIComponent(url)}`;
      }
    });
  </script>
</body>
</html>
